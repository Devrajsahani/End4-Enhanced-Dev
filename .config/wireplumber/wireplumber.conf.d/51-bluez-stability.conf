# Bluetooth stability tuning for dual-connected (multipoint) headsets on MT7921
monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
}

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
      {
        node.name = "~bluez_input.*"
      }
    ]
    actions = {
      update-props = {
        # Keep A2DP/HFP transport awake across short silences instead of suspending,
        # preventing multipoint wake-up stutters and completion report drops.
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
